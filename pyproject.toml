[project]
name = "mkd"
version = "0.1.0"
description = "Link blog post .md files into zola content"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.14.0",
    "rich",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
